<style>
    .left{
        float: left
    }
    .right{
        float: right
    }
    .center{
        float: center
    }
    .break{
        float:none;
        display:flex;
        justify-content: center;
    }
    @media only screen and (max-width:650px) {
        .left .right .center .break{
            float:none;
            display:flex;
            justify-content: center;
        }
    }   
</style>   
<div class="{{.Get "float" | safeCSS}}" style="{{.Get "style" | safeCSS }}">
    <style>  
        figure {
            vertical-align: top;
            display: inline-block;
            /* To horizontally center images and caption */
            text-align: center;
        }

        img {
            border: 6px solid var(--accent-color);
            box-shadow: 12px 12px var(--accent-color-2);
        }
        figcaption{
            padding-top: .75em;
            display: block;
        }

        /*  For mobile:   */
        @media only screen and (max-width:650px) {
            img {
                width: 80% !important
            }
            figure {
                width: 80% !important
            }
            figcaption {
            }
        }   
    </style>
    <figure style="width: {{.Get "width"}};">
        <img src={{ .Get "src" }} style="width: {{.Get "width"}};">
        {{ if .Inner }}
        <figcaption> <small><i>{{ .Inner }}</i></small>
        </figcaption>
        {{end}}
    </figure>
</div>
